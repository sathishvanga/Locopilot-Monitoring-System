name: Build Windows Desktop App

on:
  push:
    branches:
      - main
    paths:
      - 'desktop_app/**'
      - '.github/workflows/build_windows.yml'
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop_app/requirements_desktop.txt
      
      - name: Build with PyInstaller
        run: |
          cd desktop_app/build_config
          pyinstaller build_windows.spec
      
      - name: Create artifact
        run: |
          mkdir -p release
          cp desktop_app/build_config/dist/LocopilotCVVR.exe release/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocopilotCVVR-Windows
          path: release/LocopilotCVVR.exe
          retention-days: 30
      
      - name: Create Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: release/LocopilotCVVR.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

