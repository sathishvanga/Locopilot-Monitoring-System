# =============================================================================
# PLACEHOLDER — requirements.lock NOT YET GENERATED
# =============================================================================
#
# This file is committed as a placeholder ONLY. It does not yet contain real
# pinned hashes. Do NOT pass it to `pip install --require-hashes`; the install
# will fail loudly (intentionally — we want production to refuse unpinned
# installs).
#
# WHY IS IT EMPTY?
#   The lock must be generated against the same Python minor version that
#   runs in production (Python 3.12 on the GPU box, /opt/poc2/venv) AND
#   against the PyTorch CUDA 12.1 wheel index. The worktree where this
#   change was authored had neither, so the resolver was deferred to the
#   GPU box. See task spec
#   `docs/specs/code-review-fixes/tasks/0009-pin-requirements-with-hashes.md`.
#
# PRE-FLIGHT (run once after pulling this branch on any host)
#   The agent that authored this branch could not set the executable bit on
#   `scripts/lock-deps.sh` from inside its sandbox. After cloning / pulling,
#   run:
#
#     chmod +x scripts/lock-deps.sh
#     git update-index --chmod=+x scripts/lock-deps.sh   # commit the bit
#
#   Without that, `bash scripts/lock-deps.sh` still works, but
#   `./scripts/lock-deps.sh` will fail with "Permission denied".
#
# HOW TO POPULATE THIS FILE
#   On the GPU box (or any Python 3.12 venv with internet):
#
#     ssh -p 3781 admin1@103.116.80.162
#     cd /opt/poc2
#     source venv/bin/activate
#     bash scripts/lock-deps.sh         # runs the pip-compile invocation
#
#   The script runs:
#
#     pip install 'pip-tools>=7.4,<8'
#     pip-compile --generate-hashes --resolver=backtracking \
#         --extra-index-url https://download.pytorch.org/whl/cu121 \
#         --output-file requirements.lock requirements.in
#
#   Then back on your laptop:
#
#     scp -P 3781 admin1@103.116.80.162:/opt/poc2/requirements.lock .
#     git add requirements.lock requirements.in
#     git commit -m "lock: regenerate requirements.lock with hashes"
#
# AFTER POPULATING
#   1. Verify on a clean GPU venv:
#        pip install --require-hashes --no-deps -r requirements.lock
#        python -c "import torch; print(torch.cuda.is_available())"   # True
#   2. Run pip-audit:
#        pip install pip-audit
#        pip-audit --requirement requirements.lock --strict
#   3. Once 1 and 2 pass, delete the existing requirements.txt
#      (kept for now per task 0009 instructions — until human verifies the
#      lock works on the GPU box).
#
# DO NOT EDIT THIS FILE BY HAND. Always regenerate via scripts/lock-deps.sh.
# =============================================================================
